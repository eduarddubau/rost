name: CI

# Push-only: private repo, single maintainer, no fork PRs to guard. Adding
# `pull_request` would double every run on a branch that already builds.
on:
  push:
    branches: ["**"]

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # actionlint runs shellcheck over every `run:` block below.
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Version comes from global.json so CI, the dev container and the host
      # all resolve the SDK from one declaration.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Restore, build and test are separate steps so a failure names its own
      # stage in the job UI instead of surfacing as one opaque red block.
      - name: Restore
        run: |
          dotnet restore rost.sln
          dotnet tool restore

      - name: Check formatting
        run: dotnet csharpier check .

      # -warnaserror is the gate: analyzer and style violations are warnings
      # locally so they don't block a work-in-progress build, and errors here.
      # Mirrors the frontend job's `lint --max-warnings=0`.
      - name: Build
        run: dotnet build rost.sln --configuration Release --no-restore -warnaserror

      # backend.Tests is entirely EF InMemory — no UseNpgsql anywhere — so this
      # job needs no database service. --solution, not a bare path: global.json
      # selects Microsoft.Testing.Platform mode, where positional targets are gone.
      - name: Test
        run: dotnet test --solution rost.sln --configuration Release --no-build

      # `dotnet list` exits 0 even when it reports a High advisory, so the text
      # is the gate, not the exit code.
      - name: Audit dependencies
        run: |
          dotnet list rost.sln package --vulnerable --include-transitive | tee audit.log
          if grep -q 'has the following vulnerable packages' audit.log; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-angular
    steps:
      - uses: actions/checkout@v7

      # Node 24 matches the frontend service in compose.yaml. The cache path is
      # relative to the repo root, not to working-directory.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Install
        run: npm ci

      # Cheapest gate, so it runs first: a formatting failure is a two-second
      # fix and there is no point spending test minutes behind it.
      - name: Check formatting
        run: npm run format:check

      # Not an npm script: the dev container mounts only frontend-angular, so
      # this runs where the whole repo exists. Borrows the Prettier installed here.
      - name: Check root formatting
        run: npx prettier --check .. --ignore-path ../.gitignore --ignore-path ../.prettierignore

      # --max-warnings=0 so a rule demoted to "warn" still fails the build
      # instead of quietly accumulating.
      - name: Lint
        run: npm run lint -- --max-warnings=0

      # Explicit rather than relying on the builder's CI auto-detection; a run
      # that falls into watch mode hangs until the job timeout.
      - name: Test
        run: npm run test -- --watch=false

      # ng build defaults to the production configuration, so this also enforces
      # the bundle budgets in angular.json.
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Gated behind the fast jobs: no point spending ten minutes booting a stack
    # when the unit suites already went red.
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: app_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d app_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Inline on purpose, matching GitHub's own service-container examples. These
    # guard a database that exists only inside this job on an isolated VM and is
    # destroyed with it, so they protect nothing and are not secrets. Putting them
    # in GitHub Secrets would mask them out of failure logs, break CI for anyone
    # who forks the repo, and dilute the real secrets that deployment will need.
    env:
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=app_db;Username=admin;Password=ci-postgres-password
      # DbSeeder only creates dev1..dev3 when the environment is Development, and
      # every spec logs in as one of them. Set explicitly rather than inherited
      # from launchSettings, which --no-launch-profile skips.
      ASPNETCORE_ENVIRONMENT: Development
      # HS512 requires at least 64 characters.
      Jwt__Key: ci-only-signing-key-not-a-secret-padded-to-the-required-length-0000
      Jwt__Issuer: rost
      Jwt__Audience: rost
      Jwt__DurationInMinutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      # proxy.conf.json sends /api and /health to http://api:8080 — a compose
      # service name. Making the name resolve here reproduces that topology
      # instead of forking the proxy config for CI.
      - name: Resolve the api hostname to the runner
        run: echo "127.0.0.1 api" | sudo tee -a /etc/hosts

      - name: Install frontend dependencies
        working-directory: frontend-angular
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend-angular
        run: npx playwright install --with-deps chromium

      - name: Build API
        run: dotnet build rost.sln --configuration Release

      # Migrates and seeds on startup. Backgrounded, with output kept so a
      # failure to boot can be read in the artifact rather than guessed at.
      - name: Start API
        working-directory: backend
        run: |
          nohup dotnet run --configuration Release --no-build --no-launch-profile \
            --urls http://0.0.0.0:8080 > "$RUNNER_TEMP/api.log" 2>&1 &

      - name: Start dev server
        working-directory: frontend-angular
        run: nohup npx ng serve --host 0.0.0.0 > "$RUNNER_TEMP/frontend.log" 2>&1 &

      # Both are backgrounded, so nothing so far proves either one came up.
      - name: Wait for the stack
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/health >/dev/null && break
            if [ "$i" -eq 60 ]; then
              echo "::error::API never became healthy"; cat "$RUNNER_TEMP/api.log"; exit 1
            fi
            sleep 2
          done
          echo "API healthy after ${i} attempts"

          for i in $(seq 1 90); do
            curl -sf http://localhost:4200 >/dev/null && break
            if [ "$i" -eq 90 ]; then
              echo "::error::Dev server never answered"; cat "$RUNNER_TEMP/frontend.log"; exit 1
            fi
            sleep 2
          done
          echo "Dev server answering after ${i} attempts"

      # playwright.config.ts reads CI to decide retries; GitHub sets it.
      - name: Run Playwright
        working-directory: frontend-angular
        run: npx playwright test

      - name: Upload report, traces and stack logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure
          path: |
            frontend-angular/playwright-report/
            frontend-angular/test-results/
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/frontend.log
          retention-days: 7
          if-no-files-found: ignore
