<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rost — organize your work</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Projects gives your team a clean, fast home for everything you're building."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#18181c" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Applies the stored theme and language before first paint so reloads never flash.
         Keys are literals because this runs before any module loads — mirror any change
         to core/utils/storage-keys.ts here. -->
    <script>
      try {
        var t = localStorage.getItem('pj-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset['theme'] = t;
        var p = localStorage.getItem('pj-palette');
        if (p && p !== 'violet') document.documentElement.dataset['palette'] = p;
        var l = document.cookie.match(/(?:^|;\s*)lang=(en|ro)/);
        if (l) document.documentElement.lang = l[1];
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
