# VS Code Dev Containers derives the compose project name from the folder with
# non-alphanumerics stripped ("rost" -> "rost") and passes it as
# --project-name. Pin the same name here so CLI and extension drive one stack;
# otherwise each builds its own pod and they collide over the container_names.
name: rost

services:
  api:
    #user: "${UID:-1000}:${GID:-1000}"
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: build
    container_name: dotnet-api
    volumes:
      - .:/workspaces/rost:z
      - ./backend:/workspaces/rost/backend:z
      # Read-only view of the frontend deps so the dev container's TS/Angular
      # language service can resolve them; nothing here is ever executed.
      - angular_node_modules:/workspaces/rost/frontend-angular/node_modules:ro
      - ~/dotnet_docker_cache/home:/tmp/dotnet_home:z
      - ~/dotnet_docker_cache/nuget:/tmp/nuget_cache:z
    tmpfs:
      - /tmp/build:mode=777,exec
    working_dir: /workspaces/rost/backend
    ports:
      # Safe only while TrustedProxyNetworks names the proxy's single address: a request
      # arriving here comes from another IP, so its X-Forwarded-For is ignored. Widen that
      # setting to a subnet and this port becomes a rate-limit bypass.
      - "127.0.0.1:8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - Jwt__Key=${Jwt__Key}
      - Jwt__Issuer=${Jwt__Issuer}
      - Jwt__Audience=${Jwt__Audience}
      - Jwt__DurationInMinutes=${Jwt__DurationInMinutes}
      - DOTNET_ENVIRONMENT=Development
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_CLI_HOME=/tmp/dotnet_home
      - NUGET_PACKAGES=/tmp/nuget_cache
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - COMPlus_EnableDiagnostics=1
    command: dotnet watch run --no-hot-reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

  db:
    image: postgres:18-alpine
    container_name: postgres-db
    environment:
      - POSTGRES_DB=app_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ stores data in a major-version subdirectory; mount the parent
      # so pg_upgrade --link can cross versions without a mount-point boundary.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    image: node:24-alpine
    container_name: angular-frontend
    working_dir: /workspaces/rost/frontend-angular
    volumes:
      - ./frontend-angular:/workspaces/rost/frontend-angular:z
      - angular_node_modules:/workspaces/rost/frontend-angular/node_modules
      # Without this Prettier finds no config and silently uses defaults. One
      # file, read-only: npm install runs package scripts as root in here.
      - ./.prettierrc:/workspaces/rost/.prettierrc:ro,z
    ports:
      # Loopback because this skips nginx: X-Forwarded-Host here is whatever the caller
      # sends. 4000 is absent on purpose, ng serve puts hybrid SSR on 4200 and nothing
      # ever listens on 4000.
      - "127.0.0.1:4200:4200"
    command: >
      sh -c "if [ ! -d 'node_modules' ] || [ ! -f 'node_modules/.bin/ng' ]; then npm install; fi &&
             npx ng serve --host 0.0.0.0"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      api:
        condition: service_healthy

  # Single origin for the browser: / to the Angular dev server, /api and /health
  # to the API. Mirrors the production topology, where there is no dev server to
  # proxy anything. Port 8000 rather than 80 because rootless podman cannot bind
  # privileged ports without lowering net.ipv4.ip_unprivileged_port_start.
  proxy:
    image: nginx:stable-alpine
    container_name: nginx-proxy
    ports:
      - "8000:80"
    volumes:
      # Whole directory: default.conf is picked up by conf.d/*.conf, and
      # proxy_headers.inc rides along for the locations that include it.
      - ./nginx:/etc/nginx/conf.d:ro,z
    networks:
      default:
        ipv4_address: 10.99.0.10
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy

  e2e:
    # Tag tracks @playwright/test exactly; the browsers are baked into the image.
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    container_name: frontend-e2e
    working_dir: /app
    volumes:
      - ./frontend-angular:/app:z
      - e2e_node_modules:/app/node_modules
    environment:
      # Through the proxy: pointed at the dev server, nothing exercises nginx.
      - E2E_BASE_URL=http://proxy
    command: >
      sh -c "until bash -c 'echo > /dev/tcp/proxy/80' 2>/dev/null; do sleep 1; done &&
             npm install &&
             npx playwright test"
    depends_on:
      - proxy
    profiles:
      - e2e

# Pinned so the proxy can hold a fixed address, which AuthProtection:TrustedProxyNetworks
# names as the only host whose X-Forwarded-For the API believes. Change either and the
# other stops matching, silently.
networks:
  default:
    ipam:
      config:
        - subnet: 10.99.0.0/24

volumes:
  postgres_data:
  angular_node_modules:
  e2e_node_modules:
